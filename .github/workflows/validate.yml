name: Validate index

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check index.json and README
        run: python3 scripts/add-entry --check
      - name: Test research replay
        run: python3 -m unittest discover -s tests
